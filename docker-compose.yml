services:
  frontend:
    build:
      context: .
      args:
        # Passed at build time so Next.js can inline NEXT_PUBLIC_* vars
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: idenvault-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s