# CredsChain deployment — runs alongside the IdenVault container.
# Always use with a separate project name so it never touches IdenVault:
#   docker compose -p credschain -f docker-compose.credschain.yml up -d --build
services:
  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: credschain-frontend
    restart: unless-stopped
    ports:
      - "3002:3000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
